<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f6f1f8;color:#2e0f38;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8351a8}
a:hover{color:#2e0f38}
a:focus-visible{outline:3px solid #b45dbb;outline-offset:3px}
</style>
<script src="./blocks.js"></script>
</helmet>
<div data-screen-label="404 / error" style="position:relative;min-height:100vh;overflow:hidden;padding:120px 20px 170px;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <a href="Supplock Landing.dc.html" style="position:absolute;left:max(20px,calc(50% - 600px));top:28px;display:flex;align-items:center;gap:10px;color:#2e0f38;text-decoration:none">
    <svg width="26" height="26" viewBox="0 0 30 30"><polygon points="15,1 18.5,11.5 29,15 18.5,18.5 15,29 11.5,18.5 1,15 11.5,11.5" fill="#8351a8"></polygon></svg>
    <span style="font-family:'Young Serif',serif;font-size:23px">Supplock</span>
  </a>
  <sl-block deco="1" color="orchid" tilt="9" float="3" radius="16" style="position:absolute;right:max(18px,calc(50% - 340px));top:34px;width:48px;height:48px"></sl-block>
  <sl-block deco="1" mhide="1" color="teal" tilt="-8" float="1" radius="22" style="position:absolute;left:calc(50% - 520px);top:28%;width:72px;height:72px"></sl-block>
  <sl-block deco="1" mhide="1" color="mist" tilt="6" float="4" style="position:absolute;right:calc(50% - 540px);top:36%;padding:16px 18px;display:flex;align-items:center;gap:10px">
    <span style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700">LT-404</span>
  </sl-block>
  <sl-block deco="1" color="pink" tilt="-4" float="2" radius="8" style="position:absolute;left:max(14px,calc(50% - 420px));bottom:34px;padding:14px 18px;width:190px">
    <div style="font-family:'Caveat',cursive;font-size:26px;font-weight:700;line-height:1.05">{{ note }}</div>
  </sl-block>
  <sl-block deco="1" color="navy" tilt="7" float="0" radius="18" style="position:absolute;right:max(16px,calc(50% - 380px));bottom:44px;width:58px;height:58px"></sl-block>

  <sl-block color="purple" tilt="-4" float="1" radius="40" style="position:relative;z-index:2;width:100%;max-width:520px;padding:40px 36px 34px">
    <div style="font-family:'JetBrains Mono',monospace;font-size:72px;font-weight:700;line-height:1">{{ code }}</div>
    <h1 style="font-family:'Young Serif',serif;font-weight:400;font-size:40px;line-height:1.05;margin:14px 0 10px">{{ title }}</h1>
    <p style="font-size:18px;line-height:1.5;margin:0 0 24px">{{ msg }}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a href="{{ homeHref }}" style="min-height:52px;padding:0 22px;border-radius:16px;background:#fff;color:#2e0f38;font-weight:700;font-size:16px;display:flex;align-items:center;text-decoration:none;box-shadow:0 5px 0 #5e3680">{{ homeLabel }}</a>
      <a href="Supplock Login.dc.html" style="min-height:52px;padding:0 18px;border-radius:16px;border:2px solid #fff;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;text-decoration:none">Sign in again</a>
    </div>
  </sl-block>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { import(new URL('./store.js', location.href).href).then(m => { this.S = m; this.forceUpdate(); }).catch(() => {}); }
  renderVals() {
    const isErr = /error/.test(location.search);
    const u = this.S && this.S.me();
    return {
      code: isErr ? 'Oops' : '404',
      title: isErr ? 'Something spilled' : 'This shelf is empty',
      msg: isErr ? 'We hit a snag loading this page. Your requests and stock counts are safe. Try again in a moment.' : "We looked behind the tissues and under the copy paper. The page you're after isn't here.",
      note: isErr ? 'cleanup in aisle 3' : 'check the aisle number?',
      homeHref: u && u.role === 'teacher' ? 'Supplock Teacher.dc.html' : u ? 'Supplock Admin.dc.html' : 'Supplock Landing.dc.html',
      homeLabel: u ? 'Back to my dashboard' : 'Back to Supplock'
    };
  }
}
</script>
</body>
</html>
